[package]
name = "rscat"
version = "1.1.6"
edition = "2021"
description = "Rainbow cat: lolcat-compatible colorizer with image output (kitty/iTerm2), PTY run mode and rainbow shell sessions"
license = "MIT"
keywords = ["lolcat", "rainbow", "terminal", "kitty", "color"]
categories = ["command-line-utilities"]

[[bin]]
name = "rscat"
path = "src/main.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 2
strip = true
